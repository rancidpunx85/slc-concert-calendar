
name: SLC Concert Calendar

on:
  workflow_dispatch:

jobs:
  test-setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Spotify configuration
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          python -c "import os; print('Spotify Client ID configured:', bool(os.getenv('SPOTIFY_CLIENT_ID')))"
          echo "GitHub Actions is ready!"
