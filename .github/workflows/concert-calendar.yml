
name: SLC Concert Calendar

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: concert-calendar-pages
  cancel-in-progress: false

jobs:
  update-concerts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python libraries
        run: pip install -r requirements.txt

      - name: Find concerts
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python concert_finder.py

      - name: Create Apple Calendar file
        run: python create_calendar.py

      - name: Check generated calendar
        run: |
          test -s slc_concerts.ics
          test -s slc_concerts.json
          python -c "import json; events=json.load(open('slc_concerts.json')); assert isinstance(events,list) and len(events)>0, 'No concerts found; refusing to replace published calendar'; print('Concerts ready:',len(events))"

      - name: Prepare website
        run: |
          mkdir -p public
          cp slc_concerts.ics public/
          cp slc_concerts.json public/
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish concert calendar
        id: deployment
        uses: actions/deploy-pages@v4
